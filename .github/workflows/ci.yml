name: Daily Commit

on:
  schedule:
    - cron: '15 10 * * *'   # Runs daily at 10:15 UTC (specific time)
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step for 24f2008315@ds.study.iitm.ac.in
        run: echo "Scheduled workflow running"

      - name: Create daily commit
        run: |
          echo "Daily update $(date)" >> daily_log.txt
          git config user.name "24F2008315"
          git config user.email "24f2008315@ds.study.iitm.ac.in"
          git add daily_log.txt
          git commit -m "Daily scheduled commit"
          git push
